name: Build Addons

on:
  push:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.changed.outputs.addons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changed
        shell: bash
        run: |
          DIRS=$(git diff --name-only HEAD~1 HEAD | cut -d'/' -f1 | sort -u)
          ADDONS=$(for dir in $DIRS; do
            if ls "$dir"/*.toc 1>/dev/null 2>&1; then
              echo "$dir"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "addons=$ADDONS" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.addons != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: ${{ fromJson(needs.detect.outputs.addons) }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare artifact
        run: |
          mkdir build
          cp -r "${{ matrix.addon }}" build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon }}
          path: build/
