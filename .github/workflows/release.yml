name: 🚀 Release Addon

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      addon_name:
        description: "Addon folder name"
        required: true

jobs:
  resolve:
    name: 🔍 Resolve addon name
    runs-on: ubuntu-latest
    outputs:
      addon_name: ${{ steps.resolve.outputs.addon_name }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "addon_name=${{ github.event.inputs.addon_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "addon_name=${TAG%%/v*}" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: resolve
    uses: ./.github/workflows/upload-addon.yml
    with:
      addon_name: ${{ needs.resolve.outputs.addon_name }}
    secrets:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}

  github-release:
    name: 🏷️ Create GitHub Release
    needs: [resolve, upload]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: 🏷️ Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADDON_NAME="${{ needs.resolve.outputs.addon_name }}"
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#*/v}"

          zip -r "${ADDON_NAME}-${VERSION}.zip" "$ADDON_NAME"

          gh release create "$TAG" \
            --title "${ADDON_NAME} v${VERSION}" \
            --generate-notes \
            --prerelease \
            "${ADDON_NAME}-${VERSION}.zip"
